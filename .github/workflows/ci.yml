name: CI & Release Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (macOS Universal)
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine Version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ -z "${VERSION}" ]]; then
              echo "FEHLER: Release-Tags benötigen nach 'v' eine Versionsnummer." >&2
              exit 1
            fi
            echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Automated Tests
        run: |
          chmod +x scripts/*.sh
          ./scripts/run_tests.sh

      - name: Compile Universal Binaries (arm64 & x86_64)
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          ./scripts/build_app.sh "$VERSION"

      - name: Build DMG Installer Package
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          ./scripts/create_dmg.sh "$VERSION"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CIYX79Control-macOS-Universal
          path: |
            dist/CIYX79Control-*.dmg
            dist/ciy_ctl
            dist/CIYX79Control.app

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: CIYX79Control-macOS-Universal
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: "CIY X79 Control ${{ github.ref_name }}"
          files: |
            dist/CIYX79Control-*.dmg
            dist/ciy_ctl
          generate_release_notes: true
