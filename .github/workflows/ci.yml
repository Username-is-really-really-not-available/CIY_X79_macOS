name: CI & Release Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test (macOS Universal)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Automated Tests
        run: |
          chmod +x scripts/*.sh
          ./scripts/run_tests.sh

      - name: Compile Universal Binaries (arm64 & x86_64)
        run: |
          ./scripts/build_app.sh

      - name: Build DMG Installer Package
        run: |
          ./scripts/create_dmg.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CIYX79Control-macOS-Universal
          path: |
            dist/CIYX79Control-1.0.dmg
            dist/ciy_ctl
            dist/CIYX79Control.app

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "CIY X79 Control ${{ github.ref_name }}"
          files: |
            dist/CIYX79Control-1.0.dmg
            dist/ciy_ctl
          generate_release_notes: true
